<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ניהול תורים</title>
<style>
:root{color-scheme:dark;--bg:#16191D;--ink:#F2F2F0;--muted:#A7ADB5;--acc:#FF6B63;--line:#30353C;--g:#2A2F36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 Arial,sans-serif;padding:24px}
main{max-width:640px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px;align-items:center}
button,input{font:inherit}
.b{background:var(--g);color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:10px 16px;cursor:pointer}
.b.on{background:var(--acc);border-color:var(--acc);color:#111}
.b.taken{text-decoration:line-through;opacity:.5}
.b.go{background:#F2F2F0;color:#111;border-color:#F2F2F0}
input{width:100%;padding:10px;border-radius:6px;border:2px solid var(--line);background:var(--g);color:var(--ink)}
#msg{color:var(--muted);min-height:1.6em}
</style>
</head>
<body>
<main>
<h1>ניהול תורים – גדי גבריאל</h1>
<div id="app"></div>
</main>
<script>
const O="Yoni202020",R="gadi-barbershop",F="slots.json";
const API="https://api.github.com/repos/"+O+"/"+R+"/contents/"+F;
const DN=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const pad=n=>String(n).padStart(2,"0");
const $=id=>document.getElementById(id);
const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d});
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
let tok=localStorage.getItem("gb_t")||"",data=null,sha=null,di=0,sel=null,m="";
const hdr=()=>({Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"});
function msg(s){m=s;if($("msg"))$("msg").textContent=s}
async function load(){
  msg("טוען...");
  try{
    const r=await fetch(API+"?t="+Date.now(),{headers:hdr()});
    if(!r.ok){msg("לא הצלחתי לטעון ("+r.status+"). בדוק את המפתח.");data=null;return}
    const j=await r.json();sha=j.sha;
    data=JSON.parse(atob(j.content.replace(/\n/g,"")));data.taken=data.taken||{};msg("");
  }catch(e){msg("אין חיבור. נסה שוב.");data=null}
}
async function save(){
  const t=key(new Date());
  Object.keys(data.taken).forEach(k=>{if(k<t||!data.taken[k].length)delete data.taken[k]});
  msg("שומר...");draw();
  try{
    const r=await fetch(API,{method:"PUT",headers:hdr(),body:JSON.stringify({message:"update slots",content:btoa(JSON.stringify(data)),sha})});
    if(r.ok){sha=(await r.json()).content.sha;msg("נשמר. השינוי יופיע באתר תוך כדקה או שתיים.")}
    else{await load();msg("השמירה נכשלה ("+r.status+"). הנתונים נטענו מחדש, נסה שוב.")}
  }catch(e){msg("אין חיבור. נסה שוב.")}
  draw();
}
function draw(){
  const a=$("app");
  if(!tok){a.innerHTML='<p>הדבק כאן את המפתח של GitHub (פעם אחת בלבד):</p><input id="tk" type="password" autocomplete="off"><p></p><button class="b on" data-a="settoken">שמירה</button><p id="msg">'+m+"</p>";return}
  if(!data){a.innerHTML='<button class="b on" data-a="retry">נסה שוב</button> <button class="b" data-a="out">החלפת מפתח</button><p id="msg">'+m+"</p>";return}
  const d=days[di],k=key(d),open=data.open[d.getDay()]||[],tk=data.taken[k]||[];
  let h='<div class="row">'+days.map((x,i)=>'<button class="b'+(i==di?" on":"")+'" data-d="'+i+'">'+DN[x.getDay()]+" "+x.getDate()+"/"+(x.getMonth()+1)+"</button>").join("")+"</div>";
  h+=open.length?'<div class="row">'+open.map(t=>'<button class="b'+(tk.includes(t)?" taken":"")+(t===sel?" on":"")+'" data-t="'+t+'">'+t+"</button>").join("")+"</div>":"<p>אין שעות פעילות ביום הזה.</p>";
  if(sel&&open.includes(sel)){
    const x=tk.includes(sel);
    h+='<div class="row"><span>שעה <b>'+sel+"</b> – "+(x?"תפוסה":"פנויה")+'</span><button class="b go" data-a="'+(x?"cancel":"approve")+'">'+(x?"ביטול תור":"אישור תור")+"</button></div>";
  }
  h+='<div class="row"><button class="b" data-a="closeday">סגירת כל היום</button><button class="b" data-a="openday">פתיחת כל היום</button><button class="b" data-a="out">החלפת מפתח</button></div><p id="msg">'+m+"</p>";
  a.innerHTML=h;
}
$("app").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  const a=b.dataset.a;
  if(b.dataset.d!==undefined){di=+b.dataset.d;sel=null;draw();return}
  if(b.dataset.t){sel=b.dataset.t;draw();return}
  if(a=="settoken"){tok=$("tk").value.trim();localStorage.setItem("gb_t",tok);await load();draw();return}
  if(a=="retry"){await load();draw();return}
  if(a=="out"){localStorage.removeItem("gb_t");tok="";data=null;sel=null;m="";draw();return}
  const d=days[di],k=key(d),open=data.open[d.getDay()]||[],cur=data.taken[k]||[];
  if(a=="approve"&&sel){data.taken[k]=cur.includes(sel)?cur:cur.concat(sel)}
  else if(a=="cancel"&&sel){data.taken[k]=cur.filter(x=>x!==sel)}
  else if(a=="closeday"){data.taken[k]=open.slice()}
  else if(a=="openday"){delete data.taken[k]}
  else return;
  await save();
});
(async()=>{if(tok)await load();draw()})();
</script>
</body>
</html>
